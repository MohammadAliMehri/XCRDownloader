<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XCRDownloader</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>\">
</head>
<body>
    <!-- ===================== TOP NAV ===================== -->
    <nav class="top-nav">
        <div class="nav-inner">
            <div class="nav-brand">
                <span class="nav-logo">⚡</span>
                <span class="nav-title">XCR</span>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-page="downloader">⬇️ Downloader</button>
                <button class="nav-tab" data-page="player">🎵 Player</button>
            </div>
            <span class="nav-version">v1.4</span>
        </div>
    </nav>

    <!-- ===================== DOWNLOADER PAGE ===================== -->
    <div class="page active" id="page-downloader">
        <div class="page-inner">
            <!-- Download Card -->
            <section class="card">
                <div class="card-header">
                    <h2>Download</h2>
                    <div class="tab-switcher">
                        <button class="tab active" data-tab="single">Single URL</button>
                        <button class="tab" data-tab="batch">Batch</button>
                    </div>
                </div>

                <div class="tab-content active" id="tab-single">
                    <div class="input-row">
                        <input type="text" id="url-input" class="input-main" placeholder="Paste URL — YouTube, Instagram, TikTok, SoundCloud, X, Pinterest..." autocomplete="off">
                        <button class="btn btn-primary" id="btn-download">Download</button>
                    </div>
                    <div class="platform-detect" id="platform-detect"></div>

                    <div class="preview-card" id="preview-card" style="display:none;">
                        <img id="preview-thumb" class="preview-thumb" src="" alt="">
                        <div class="preview-info">
                            <div class="preview-title" id="preview-title"></div>
                            <div class="preview-meta" id="preview-meta"></div>
                            <div class="preview-desc" id="preview-desc"></div>
                        </div>
                    </div>

                    <div class="options-row">
                        <div class="option-group">
                            <label>Quality</label>
                            <select id="quality">
                                <option value="best">Best</option>
                                <option value="hd">HD 1080p</option>
                                <option value="sd">SD 480p</option>
                            </select>
                        </div>
                        <div class="option-group">
                            <label>Format</label>
                            <select id="format">
                                <option value="video">Video MP4</option>
                                <option value="audio">Audio MP3</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="tab-content" id="tab-batch">
                    <textarea id="batch-urls" rows="5" placeholder="One URL per line..."></textarea>
                    <div class="options-row">
                        <div class="option-group">
                            <label>Quality</label>
                            <select id="batch-quality"><option value="best">Best</option><option value="hd">HD</option><option value="sd">SD</option></select>
                        </div>
                        <button class="btn btn-primary" id="btn-batch-download">Download All</button>
                    </div>
                </div>
            </section>

            <!-- Platform Grid -->
            <div class="platform-chips">
                <span class="chip" data-p="youtube">▶️ YouTube</span>
                <span class="chip" data-p="instagram">📸 Instagram</span>
                <span class="chip" data-p="tiktok">🎵 TikTok</span>
                <span class="chip" data-p="soundcloud">🔊 SoundCloud</span>
                <span class="chip" data-p="twitter">🐦 X</span>
                <span class="chip" data-p="pinterest">📌 Pinterest</span>
                <span class="chip" data-p="generic">🌐 1800+ more</span>
            </div>

            <!-- Progress -->
            <section class="card" id="progress-section" style="display:none;">
                <div class="card-header"><h2>⏳ Progress</h2></div>
                <div class="progress-track"><div class="progress-fill" id="progress-bar"></div></div>
                <div class="progress-label" id="progress-status">Preparing...</div>
            </section>

            <!-- Results -->
            <section class="card" id="results-section" style="display:none;">
                <div class="card-header"><h2>✅ Downloaded</h2></div>
                <div id="results-list"></div>
            </section>

            <!-- History -->
            <section class="card">
                <div class="card-header">
                    <h2>History</h2>
                    <button class="btn btn-ghost" id="btn-refresh-history">↻</button>
                </div>
                <div id="history-list"><p class="empty-state">No downloads yet.</p></div>
            </section>
        </div>
    </div>

    <!-- ===================== PLAYER PAGE ===================== -->
    <div class="page" id="page-player">
        <div class="player-layout">
            <!-- Left: Search + Results -->
            <div class="player-left">
                <!-- Search -->
                <div class="player-search">
                    <input type="text" id="music-search-input" class="input-main" placeholder="Search songs, videos, podcasts..." autocomplete="off">
                </div>
                <!-- Category Pills -->
                <div class="category-pills" id="category-tabs" style="display:none;">
                    <button class="pill active" data-cat="all">All</button>
                    <button class="pill" data-cat="track">🎵 Music</button>
                    <button class="pill" data-cat="video">🎬 Videos</button>
                    <button class="pill" data-cat="podcast">🎙️ Podcasts</button>
                    <button class="pill" data-cat="album">💿 Albums</button>
                    <button class="pill" data-cat="artist">👤 Artists</button>
                </div>
                <div id="search-status" class="search-status"></div>
                <div id="search-results" class="search-results"></div>
                <div id="search-load-more" style="display:none;text-align:center;padding:12px;">
                    <button class="btn btn-ghost" id="btn-load-more">Load more</button>
                </div>
            </div>

            <!-- Right: Now Playing + Queue -->
            <div class="player-right">
                <!-- Now Playing Hero -->
                <div class="np-hero" id="np-hero">
                    <div class="np-art-wrap">
                        <img id="np-cover" class="np-art" src="" alt="">
                        <video id="np-video" class="np-video-art" preload="none" style="display:none;" playsinline></video>
                        <iframe id="np-embed" class="np-embed-art" style="display:none;" title="Embedded video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                        <div class="np-art-placeholder" id="np-art-placeholder">🎵</div>
                    </div>
                    <div class="np-details">
                        <div class="np-title" id="np-title">Nothing playing</div>
                        <div class="np-artist" id="np-artist">Search and pick a track</div>
                    </div>
                    <!-- Progress -->
                    <div class="np-seek">
                        <span class="np-time" id="np-current">0:00</span>
                        <div class="np-progress-bar" id="np-progress-bar">
                            <div class="np-progress-fill" id="np-progress-fill"></div>
                        </div>
                        <span class="np-time" id="np-duration">0:00</span>
                    </div>
                    <!-- Controls -->
                    <div class="np-controls">
                        <button class="np-ctrl" id="np-shuffle" title="Shuffle">🔀</button>
                        <button class="np-ctrl" id="np-prev" title="Previous">⏮</button>
                        <button class="np-ctrl np-play-btn" id="np-playpause" title="Play">▶</button>
                        <button class="np-ctrl" id="np-next" title="Next">⏭</button>
                        <button class="np-ctrl" id="np-repeat" title="Repeat">🔁</button>
                    </div>
                    <!-- Volume + Actions -->
                    <div class="np-bottom">
                        <button class="np-ctrl" id="np-video-toggle" title="Toggle Video" style="display:none;">🎬</button>
                        <div class="np-volume">
                            <button class="np-ctrl np-vol-btn" id="np-vol-icon">🔊</button>
                            <input type="range" id="np-volume" class="vol-slider" min="0" max="1" step="0.01" value="1">
                        </div>
                        <button class="np-ctrl" id="np-download" title="Download">⬇️</button>
                    </div>
                </div>

                <!-- Queue -->
                <div class="np-queue" id="np-queue">
                    <div class="queue-header">Queue</div>
                    <div class="queue-list" id="queue-list"><p class="empty-state">Queue is empty</p></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden audio element -->
    <audio id="np-audio" preload="none"></audio>

    <script src="/static/js/app.js"></script>
</body>
</html>
