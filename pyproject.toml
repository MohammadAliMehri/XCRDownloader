[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcrdownloader"
version = "1.8.0"
description = "Universal social media downloader with web UI, search, and anime streaming"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mohammad Ali Mehri", email = "mehri@example.com"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.7.4",
    "curl_cffi>=0.10,<0.16",
    "gallery-dl>=1.28.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "rich>=13.7.0",
    "imageio-ffmpeg>=0.5.1",
    "tqdm>=4.66.0",
    "colorama>=0.4.6",
    "aiohttp>=3.9.0",
    "fake-useragent>=1.4.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "playwright>=1.40.0",
]
[project.urls]
Homepage = "https://github.com/MohammadAliMehri/XCRDownloader"
Repository = "https://github.com/MohammadAliMehri/XCRDownloader"
Issues = "https://github.com/MohammadAliMehri/XCRDownloader/issues"

[project.scripts]
xcrdownloader = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
"*" = ["templates/*", "static/*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-select = ["I", "UP", "B", "C4", "SIM", "TID"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"