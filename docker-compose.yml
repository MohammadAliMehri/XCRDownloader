# version: "3.8"  # obsolete, removed

services:
  xcrdownloader:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./downloads:/app/downloads
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Run as non-root user (matches Dockerfile)
    user: "1000:1000"
    # Healthcheck
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    # Graceful shutdown
    stop_signal: SIGINT
